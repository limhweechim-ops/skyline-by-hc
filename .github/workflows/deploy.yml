name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Verify Cloudflare deployment secrets
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID GitHub repository secret." >&2
            exit 1
          fi

      - name: Prepare build scripts
        run: chmod +x scripts/*.sh

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Build production artifact
        run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      - name: Verify live five-lens taxonomy
        shell: bash
        run: |
          set -euo pipefail

          verify_taxonomy() {
            local site_url="$1"
            local response_body
            local response_headers
            response_body="$(mktemp)"
            response_headers="$(mktemp)"

            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 \
              --user-agent "Mozilla/5.0 Skyline-Deployment-Check/${GITHUB_SHA}" \
              --dump-header "${response_headers}" \
              --output "${response_body}" \
              "${site_url}?release=${GITHUB_SHA}"

            if ! grep --fixed-strings --quiet "Developer Leadership" "${response_body}"; then
              echo "Developer Leadership is missing from ${site_url}." >&2
              exit 1
            fi

            if ! grep --ignore-case --quiet '^cache-control:.*no-store' "${response_headers}"; then
              echo "The no-store HTML policy is missing from ${site_url}." >&2
              sed -n '1,40p' "${response_headers}" >&2
              exit 1
            fi

            echo "Verified current taxonomy and HTML freshness at ${site_url}."
          }

          verify_taxonomy "https://limhweechim.com/"

      - name: Verify live Connect conversion path
        shell: bash
        run: |
          set -euo pipefail

          response_body="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 \
            --user-agent "Mozilla/5.0 Skyline-Deployment-Check/${GITHUB_SHA}" \
            --output "${response_body}" \
            "https://limhweechim.com/connect?release=${GITHUB_SHA}"

          grep --fixed-strings --quiet "Got an interesting project problem? Let’s compare notes." "${response_body}"
          grep --fixed-strings --quiet "Speaking or media invitation" "${response_body}"
          grep --fixed-strings --quiet "https://limhweechim.com/connect" "${response_body}"
          if grep --fixed-strings --quiet "The form will be connected before the public launch." "${response_body}"; then
            echo "Legacy form placeholder remains on /connect." >&2
            exit 1
          fi

          verify_redirect() {
            local source_path="$1"
            local response_headers
            local response_status
            response_headers="$(mktemp)"
            response_status="$(curl --silent --show-error \
              --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 \
              --user-agent "Mozilla/5.0 Skyline-Deployment-Check/${GITHUB_SHA}" \
              --dump-header "${response_headers}" \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://limhweechim.com${source_path}?release=${GITHUB_SHA}")"

            if [[ "${response_status}" != "301" && "${response_status}" != "308" ]]; then
              echo "${source_path} returned ${response_status}; expected 301 or 308." >&2
              exit 1
            fi
            grep --ignore-case --quiet '^location: /connect' "${response_headers}"
          }

          verify_redirect "/contact"
          verify_redirect "/speaking"
          echo "Verified live Connect page and permanent legacy redirects."
